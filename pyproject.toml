[project]
name = "couple-date-planner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Juan Pablo Zamanillo", email = "juanpablozamanillo@example.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=2.29.0",
    "pydantic>=2.12.5",
    "streamlit>=1.55.0",
]

[project.scripts]
couple-date-planner = "couple_date_planner:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
